name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: 构建并推送到 Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/robot-sim:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/robot-sim:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max