<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>智能巡检机器人 · 二维仿真</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0;
         background: #0f172a; color: #e2e8f0; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  canvas { background: #1e293b; border-radius: 8px; display: block; }
  .panel { flex: 1; min-width: 260px; }
  .stat { background: #1e293b; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .stat b { color: #38bdf8; font-weight: 600; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
  button { background: #334155; color: #e2e8f0; border: 0; border-radius: 8px;
           padding: 14px 0; font-size: 15px; cursor: pointer; }
  button:hover { background: #475569; }
  button:active { background: #0ea5e9; }
  .spacer { visibility: hidden; }
  .msg { min-height: 22px; font-size: 13px; color: #94a3b8; margin-top: 10px; }
  .msg.warn { color: #fbbf24; }
  .msg.ok { color: #4ade80; }
  #rounds { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
  #rounds li { padding: 4px 0; border-bottom: 1px solid #334155; }
</style>
</head>
<body>
<div class="wrap">
  <h1>智能巡检机器人 · 二维仿真</h1>
  <div class="sub">用方向键或按钮控制机器人；障碍物与边界不可通过。</div>

  <div class="row">
    <canvas id="map" width="500" height="500"></canvas>

    <div class="panel">
      <div class="stat">
        位置：<b id="pos">-</b><br>
        状态：<b id="status">-</b><br>
        完成轮次：<b id="count">0</b>
      </div>

      <div class="pad">
        <div class="spacer"></div>
        <button onclick="move('up')">上</button>
        <div class="spacer"></div>
        <button onclick="move('left')">左</button>
        <div class="spacer"></div>
        <button onclick="move('right')">右</button>
        <div class="spacer"></div>
        <button onclick="move('down')">下</button>
        <div class="spacer"></div>
      </div>

      <div class="msg" id="msg"></div>
      <ul id="rounds"></ul>
    </div>
  </div>
</div>

<script>
const CELL = 50;
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let state = null;

function draw() {
  if (!state) return;
  const m = state.map;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 网格
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  for (let x = 0; x <= m.width; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, m.height * CELL); ctx.stroke();
  }
  for (let y = 0; y <= m.height; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(m.width * CELL, y * CELL); ctx.stroke();
  }

  // 障碍物
  ctx.fillStyle = '#475569';
  for (const o of m.obstacles) {
    ctx.fillRect(o[0] * CELL + 2, o[1] * CELL + 2, CELL - 4, CELL - 4);
  }

  // 起点
  ctx.strokeStyle = '#22d3ee';
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 2;
  ctx.strokeRect(state.start.x * CELL + 6, state.start.y * CELL + 6, CELL - 12, CELL - 12);
  ctx.setLineDash([]);

  // 机器人
  const cx = state.robot.x * CELL + CELL / 2;
  const cy = state.robot.y * CELL + CELL / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL / 2 - 8, 0, Math.PI * 2);
  ctx.fillStyle = '#38bdf8';
  ctx.fill();
  ctx.strokeStyle = '#0ea5e9';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function render() {
  draw();
  document.getElementById('pos').textContent =
    '(' + state.robot.x + ', ' + state.robot.y + ')';
  document.getElementById('status').textContent =
    state.status === 'away' ? '已离开起点（返回起点可完成一轮）' : '在起点 / 尚未出发';
  document.getElementById('count').textContent = state.rounds.length;

  const ul = document.getElementById('rounds');
  ul.innerHTML = '';
  for (const r of state.rounds) {
    const li = document.createElement('li');
    li.textContent = '第 ' + r.round + ' 轮  ' + r.finished_at;
    ul.appendChild(li);
  }
}

async function loadState() {
  const res = await fetch('/api/state');
  state = await res.json();
  render();
}

async function move(dir) {
  const res = await fetch('/api/move', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dir: dir })
  });
  const r = await res.json();
  const msg = document.getElementById('msg');
  if (!r.ok) {
    msg.className = 'msg warn';
    msg.textContent = r.reason === 'blocked' ? '前方有障碍物，移动受阻'
                    : r.reason === 'out_of_bounds' ? '已到地图边界，移动受阻'
                    : '无效方向';
  } else if (r.round_completed) {
    msg.className = 'msg ok';
    msg.textContent = '已返回起点，完成一轮巡检并记录';
  } else {
    msg.className = 'msg';
    msg.textContent = '移动成功';
  }
  await loadState();
}

document.addEventListener('keydown', function (e) {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

loadState();
</script>
</body>
</html>
